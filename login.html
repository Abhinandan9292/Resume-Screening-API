<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Sign In | Campus Placement Portal</title>
    <link rel="stylesheet" href="styles.css?v=20260815">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="sign-in-title">
            <a class="brand auth-brand" href="index.html">
                <span>Campus Placement Portal</span>
            </a>
            <h1 id="sign-in-title">Student sign in</h1>
            <p class="muted">Use the email address and password associated with your student profile.</p>

            <div id="login-message" class="form-message" role="alert" aria-live="polite"></div>

            <form id="loginForm" class="form-stack">
                <div>
                    <label class="field-label" for="email">Email address</label>
                    <input class="input" type="email" id="email" autocomplete="email" required>
                </div>

                <div>
                    <label class="field-label" for="password">Password</label>
                    <input class="input" type="password" id="password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="button">Sign in</button>
            </form>

            <p class="muted" style="margin: 24px 0 0;">New to the portal? <a href="student.html" class="text-button">Create your student profile</a></p>
        </section>
    </main>

    <script>
        const API_BASE = "https://resume-screening-api-vqq8.onrender.com";
        const message = document.getElementById("login-message");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `form-message visible ${type}`;
        }

        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const submitBtn = event.target.querySelector("button");
            submitBtn.innerText = "Signing in…";
            submitBtn.disabled = true;
            message.className = "form-message";

            const loginData = {
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            };

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(loginData)
                });
                const result = await response.json();

                if (result.status === "success") {
                    localStorage.setItem("studentSession", JSON.stringify(result.user));
                    window.location.href = "dashboard.html";
                } else {
                    showMessage(result.message || "We could not sign you in. Check your email and password, then try again.", "error");
                }
            } catch (error) {
                showMessage("The sign-in service is unavailable. Please try again shortly.", "error");
                console.error(error);
            } finally {
                submitBtn.innerText = "Sign in";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
